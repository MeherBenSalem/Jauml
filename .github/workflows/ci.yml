# Build and test every MultiLoader workspace on pushes and pull requests.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # 21 stays JAVA_HOME for the 1.20.1/1.21.1 builds (1.20.1 compiles with the 17 toolchain);
      # the root build hands the 26.x workspaces JAVA_HOME_25_X64.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            25
            21

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build 1.20.1, 1.21.1, 26.2 and 26.3
        run: |
          chmod +x gradlew 1.20.1/gradlew 1.21.1/gradlew 26.2/gradlew 26.3/gradlew
          ./gradlew testAll buildAll --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: jauml-jars
          path: dist/*.jar
