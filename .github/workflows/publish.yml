# Publish Jauml loader jars to CurseForge on version tags (NightBeam convention: CurseForge only since 24 Nov 2026).
#
# Each jar becomes its own CurseForge file with correct Minecraft version and loader tags.
#
# Required secrets: CURSEFORGE_TOKEN (upload token), CURSEFORGE_API_KEY (Core API key, for the same-day guard)
# Required variable: CURSEFORGE_ID
# The existing Modrinth project stays up as it is but gets no new versions.
#
# Usage: git tag v2.1.1 && git push --tags
#
# Same-day guard (NightBeam convention): a real release stops if this mod already had a release today
# (Africa/Tunis calendar day) on CurseForge or in an earlier Publish run. Dry runs only report it.
# Every release must be exactly the 8 convention targets: 1.20.1 Fabric/Forge, 1.21.1, 26.2 and 26.3 Fabric/NeoForge.

name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version (without v) when not tagging
        required: false
      dry_run:
        description: Skip uploads if true
        required: false
        default: "false"

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.version }}" ]]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "Provide a v*.*.* tag or workflow_dispatch version" >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test the same-day guard
        run: node --test scripts/*.test.mjs

      - name: Same-day guard
        env:
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISH_WORKFLOW: publish.yml
          UPLOAD_STEP: "Upload CurseForge|Upload Modrinth + CurseForge|Upload Modrinth + CurseForge (one version per jar)"
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/same_day_guard.mjs

      - name: Find prebuilt release jars
        id: prebuilt
        shell: bash
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          mapfile -t JARS < <(find releases -maxdepth 1 -type f -name "*-${VERSION}.jar" \
            ! -name "*-sources.jar" ! -name "*-javadoc.jar" \
            ! -name "*-common-*" ! -name "*-dev*.jar" 2>/dev/null | sort)
          if [ ${#JARS[@]} -gt 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
            echo "list<<$EOF" >> "$GITHUB_OUTPUT"
            printf '%s\n' "${JARS[@]}" >> "$GITHUB_OUTPUT"
            echo "$EOF" >> "$GITHUB_OUTPUT"
            printf 'Using prebuilt jars:\n'
            printf '%s\n' "${JARS[@]}"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No releases/*-${VERSION}.jar — will build with Gradle"
          fi

      # 21 stays JAVA_HOME for the 1.20.1/1.21.1 builds (1.20.1 compiles with the 17 toolchain);
      # the root build hands the 26.x workspaces JAVA_HOME_25_X64.
      - uses: actions/setup-java@v4
        if: steps.prebuilt.outputs.found != 'true'
        with:
          distribution: temurin
          java-version: |
            17
            25
            21

      - uses: gradle/actions/setup-gradle@v4
        if: steps.prebuilt.outputs.found != 'true'

      - name: Build MultiLoader workspaces (1.20.1, 1.21.1, 26.2, 26.3)
        if: steps.prebuilt.outputs.found != 'true'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew 1.20.1/gradlew 1.21.1/gradlew 26.2/gradlew 26.3/gradlew
          ./gradlew buildAll --no-daemon

      - name: Find jars
        id: jars
        shell: bash
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          mapfile -t JARS < <(find releases -maxdepth 1 -type f -name "*-${VERSION}.jar" 2>/dev/null | sort)
          if [ ${#JARS[@]} -eq 0 ]; then
            mapfile -t JARS < <(find . -type f -path "*/build/libs/*-${VERSION}.jar" \
              ! -name "*-sources.jar" ! -name "*-javadoc.jar" \
              ! -name "*-dev.jar" ! -name "*-dev-shadow.jar" \
              ! -name "*-common-*" ! -path "*/common/build/*" | sort)
          fi
          FILTERED=()
          for j in "${JARS[@]}"; do
            size=$(stat -c%s "$j" 2>/dev/null || stat -f%z "$j")
            if [ "$size" -lt 1024 ]; then
              echo "Skipping empty/tiny jar ($size bytes): $j" >&2
              continue
            fi
            FILTERED+=("$j")
          done
          JARS=("${FILTERED[@]}")
          if [ ${#JARS[@]} -eq 0 ]; then
            echo "No jars found for version ${VERSION}" >&2
            exit 1
          fi
          printf '%s\n' "${JARS[@]}"
          # Exactly the 8 convention targets, one jar each.
          EXPECTED="fabric-1.20.1 forge-1.20.1 fabric-1.21.1 neoforge-1.21.1 fabric-26.2 neoforge-26.2 fabric-26.3 neoforge-26.3"
          FOUND=""
          for j in "${JARS[@]}"; do
            n=$(basename "$j" | tr 'A-Z' 'a-z')
            case "$n" in *neoforge*) l=neoforge;; *fabric*) l=fabric;; *forge*) l=forge;; *) l=unknown;; esac
            g=$(echo "$n" | grep -oE '(^|-)(26\.[0-9]+(\.[0-9]+)?|1\.[0-9]+(\.[0-9]+)?)(-|$)' | head -1 | tr -d '-')
            FOUND="$FOUND $l-$g"
          done
          want=$(printf '%s\n' $EXPECTED | sort | tr '\n' ' ')
          got=$(printf '%s\n' $FOUND | sort | tr '\n' ' ')
          if [ "$want" != "$got" ]; then
            echo "::error::Expected exactly the 8 convention jars ($want) but found: $got"
            exit 1
          fi
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "list<<$EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${JARS[@]}" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Same-day guard (again, right before upload)
        if: ${{ inputs.dry_run != 'true' }}
        env:
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISH_WORKFLOW: publish.yml
          UPLOAD_STEP: "Upload CurseForge|Upload Modrinth + CurseForge|Upload Modrinth + CurseForge (one version per jar)"
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/same_day_guard.mjs

      - name: Upload CurseForge
        if: ${{ inputs.dry_run != 'true' }}
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}
          VERSION: ${{ steps.ver.outputs.version }}
          JAR_LIST: ${{ steps.jars.outputs.list }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CURSEFORGE_ID:-}" || { echo "Set the repo variable CURSEFORGE_ID" >&2; exit 1; }
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const version = process.env.VERSION;
          const jars = process.env.JAR_LIST.split(/\n/).map(s => s.trim()).filter(Boolean);
          if (!jars.length) throw new Error('No jars to upload');

          function resolveChangelog(ver) {
            if (fs.existsSync('CHANGELOG.md')) {
              const content = fs.readFileSync('CHANGELOG.md', 'utf8');
              const match = content.match(new RegExp(`## \\[${ver.replace(/\./g, '\\.')}\\][\\s\\S]*?(?=\\n## \\[|$)`));
              if (match) return match[0].trim();
              return content;
            }
            return `Release ${ver}`;
          }
          const changelog = resolveChangelog(version);

          const LOADER_IDS = { fabric: 7499, forge: 7498, neoforge: 10150, quilt: 9153 };

          function detect(jar) {
            const n = path.basename(jar).toLowerCase();
            const p = jar.replace(/\\/g, '/').toLowerCase();
            let loader = null;
            if (n.includes('neoforge') || p.includes('/neoforge/')) loader = 'neoforge';
            else if (n.includes('fabric') || p.includes('/fabric/')) loader = 'fabric';
            else if (n.includes('quilt') || p.includes('/quilt/')) loader = 'quilt';
            else if (n.includes('forge') || p.includes('/forge/')) loader = 'forge';
            else loader = 'fabric';
            let gv = null;
            const m26 = n.match(/(?:^|-)(26\.\d+(?:\.\d+)?)(?:-|$)/);
            const m1 = n.match(/(?:^|-)(1\.\d+(?:\.\d+)?)(?:-|$)/);
            if (m26) gv = m26[1];
            else if (m1) gv = m1[1];
            return { loader, gv };
          }

          function flattenVersions(payload) {
            const flat = [];
            const data = payload?.data ?? payload;
            if (!Array.isArray(data)) return flat;
            for (const entry of data) {
              if (Array.isArray(entry?.versions)) {
                for (const v of entry.versions) flat.push(v);
              } else if (entry && (entry.id != null) && entry.name) {
                flat.push(entry);
              }
            }
            return flat;
          }

          function findVersionId(flat, name) {
            const exact = flat.find((v) => v.name === name || v.slug === name);
            if (exact) return exact.id;
            const loose = flat.find((v) => String(v.name).toLowerCase() === String(name).toLowerCase());
            return loose?.id;
          }

          (async () => {
            let flat = [];
            const uploadGv = await fetch('https://minecraft.curseforge.com/api/game/versions', {
              headers: { 'X-Api-Token': process.env.CURSEFORGE_TOKEN },
            });
            if (uploadGv.ok) {
              flat = flattenVersions(await uploadGv.json());
            }
            if (!flat.length) {
              const gvRes = await fetch('https://api.curseforge.com/v1/games/432/versions', {
                headers: { 'x-api-key': process.env.CURSEFORGE_API_KEY },
              });
              const gvText = await gvRes.text();
              if (!gvRes.ok) throw new Error('CurseForge versions ' + gvRes.status + ' ' + gvText.slice(0, 300));
              flat = flattenVersions(JSON.parse(gvText));
            }
            if (!flat.length) throw new Error('No CurseForge game versions resolved');

            let uploaded = 0;
            for (const jar of jars) {
              const { loader, gv } = detect(jar);
              const want = gv || '1.21.1';
              const mcId = findVersionId(flat, want);
              const loaderId = LOADER_IDS[loader];
              const clientId = findVersionId(flat, 'Client');
              const serverId = findVersionId(flat, 'Server');
              if (mcId == null) {
                throw new Error('No CurseForge game version id for ' + want + ' (' + path.basename(jar) + ')');
              }
              const gameVersions = [mcId];
              if (loaderId != null) gameVersions.push(loaderId);
              if (clientId != null) gameVersions.push(clientId);
              if (serverId != null) gameVersions.push(serverId);
              const gameVersionNames = [];
              if (clientId == null) gameVersionNames.push('Client');
              if (serverId == null) gameVersionNames.push('Server');
              const meta = {
                changelog,
                changelogType: 'markdown',
                displayName: `${version} · ${loader} · ${want}`,
                gameVersions,
                releaseType: 'release',
              };
              if (gameVersionNames.length) meta.gameVersionNames = gameVersionNames;
              if (loader === 'fabric') {
                meta.relations = { projects: [{ slug: 'fabric-api', type: 'optionalDependency' }] };
              }
              const cfForm = new FormData();
              cfForm.append('metadata', JSON.stringify(meta));
              cfForm.append('file', new Blob([fs.readFileSync(jar)]), path.basename(jar));
              const cfRes = await fetch(
                `https://minecraft.curseforge.com/api/projects/${process.env.CURSEFORGE_ID}/upload-file`,
                { method: 'POST', headers: { 'X-Api-Token': process.env.CURSEFORGE_TOKEN }, body: cfForm },
              );
              const cfText = await cfRes.text();
              if (!cfRes.ok) throw new Error('CurseForge ' + cfRes.status + ' ' + cfText.slice(0, 500));
              console.log('CurseForge OK', meta.displayName, path.basename(jar));
              uploaded += 1;
            }
            console.log('CurseForge uploaded', uploaded, 'file(s)');
          })().catch((e) => { console.error(e); process.exit(1); });
          NODE
